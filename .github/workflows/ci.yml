name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: kernel and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain `lean-toolchain` pins.  The build is the
      # Makefile's, so lean-action's own build, test and cache steps are off.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - run: make core

      - name: Run HolTrace's tests
        shell: bash
        run: |
          lake lean HolTest/HolTraceTest.lean 2>&1 | tee holtrace-test.log
          ok=$(grep -c -- '-> OK' holtrace-test.log || true)
          bad=$(grep -cE 'MISMATCH|\.lean:[0-9]+:[0-9]+: error|^error|^warning:' holtrace-test.log || true)
          echo "HolTrace: $ok checks OK, $bad bad"
          test "$bad" = "0"
          test "$ok" -ge 40
